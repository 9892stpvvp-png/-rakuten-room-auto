# 商品選定・紹介文作成のための設定サンプルです。
# コピーして settings.yaml を作り、必要に応じて調整してください。
#   cp config/settings.example.yaml config/settings.yaml

# 楽天市場 商品検索APIのエンドポイント。
# 楽天側の仕様変更でURLが変わった場合は、コードを書き換えずここだけ直せばよい。
api_endpoint: "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260401"

# 楽天ウェブサービスのアプリ設定「許可されたWebサイト」に登録したURL。
# 2026年のAPI基盤刷新後は、このURLをOrigin/Refererヘッダーとして送らないと
# HTTP 403（アクセス拒否）になる。GitHub Pagesの案内ページ（index.html）のURLを
# 登録した場合は、そのURLをそのまま指定する。
# 登録したURLと1文字でも違うと403になるので注意（末尾のスラッシュやhttp/httpsの違いも含む）。
allowed_origin: "https://9892stpvvp-png.github.io/-rakuten-room-auto/"

# 楽天ウェブサービスAPIで検索するキーワード。
#
# 全ジャンル化（description-genre-001）以降、毎日の投稿候補10件（daily_target）は
# 「暮らしの便利グッズ5件＋消耗品・飲料5件」という固定構成では選ばない。
# ここに登録した全ジャンルのkeywordsエントリの検索結果を1つのプールにまとめ、
# 品質・需要（レビュー件数・評価）・ジャンルの偏り防止・ランダム性を踏まえて
# 上位daily_target件を選ぶ（src.ranking.select_top_candidates）。
# 「各ジャンル◯件」という固定ローテーションにはしない（売れ筋状況に応じて
# 構成が変わる）。
#
# - group: convenience（暮らしの便利グッズ寄り＝一度買えば長く使う耐久品）／
#   consumable（消耗品・飲料寄り＝繰り返し購入される消耗品）のいずれか。
#   選定件数の目標（5+5）としては使わなくなったが、次の用途に引き続き使う。
#     - consumableのカテゴリーが「水」「お茶」「ジュース」（飲料）の場合、
#       alcohol_keywordsによるアルコール除外を適用する
#     - group=consumableの場合、consumable_durable_accessory_keywordsによる
#       「消耗品を収納する耐久雑貨」除外を適用する
#     - スマホ投稿ページ（room/）の枠バッジ表示、TikTok向け選定の優先度に使う
#   （後方互換のため残しているフィールド。省略した場合はconvenience扱い）。
# - category: 紹介文の言い回し・ハッシュタグ・ジャンルの偏り防止で使う
#   「ジャンル」。既存の「掃除／収納／キッチン／時短／暮らし全般／洗剤／
#   キッチン消耗品／日用品／水／お茶／ジュース」に加え、全ジャンル化で
#   「食品／美容／家電／生活雑貨／ファッション／ペット用品／ベビー用品／
#   健康」を追加した。PRODUCT_TYPE_TEMPLATESに一致しない場合、新しく
#   追加したジャンルはDEFAULT_CATEGORYの安全な汎用テンプレートにフォール
#   バックする（description_generator.pyのGENERIC_TEMPLATESにまだ個別の
#   テンプレートを追加していないため。確認できない用途は断定しない）。
# - extra_keywords（省略可）: keywordの検索結果が条件フィルタ・重複除外の後に
#   0件だった場合だけ、追加で試す同じテーマ内の別の検索ワード（前から順に、
#   1件以上見つかるか、全て試し終わるまで試す）。品質条件（レビュー評価・
#   件数等）は緩めず、検索ワードの幅だけを広げてカテゴリの偏り・候補不足を
#   減らすためのもの（reliability-005 / description-match-002での監査対応）。
#
# 医薬品・医療機器・サプリメント等、健康効果の断定リスクが高く紹介文の
# 安全性を担保しにくい商品は、そもそも検索対象に含めていない（ng_keywords
# でも念のため除外している）。
keywords:
  # --- 暮らし・掃除・収納・キッチン・時短（既存） ---
  - keyword: "掃除 便利グッズ"
    category: "掃除"
    group: "convenience"
    extra_keywords: ["お掃除グッズ", "バス 掃除グッズ", "トイレ 掃除グッズ"]
  - keyword: "収納 便利グッズ"
    category: "収納"
    group: "convenience"
    extra_keywords: ["収納グッズ", "整理整頓グッズ", "クローゼット 収納"]
  - keyword: "キッチン 時短グッズ"
    category: "キッチン"
    group: "convenience"
    extra_keywords: ["調理器具 便利グッズ", "キッチン 便利グッズ"]
  - keyword: "時短家電"
    category: "時短"
    group: "convenience"
    extra_keywords: ["時短グッズ", "家事 時短"]
  - keyword: "生活雑貨 便利グッズ"
    category: "暮らし全般"
    group: "convenience"
    extra_keywords: ["玄関 便利グッズ", "旅行グッズ 便利", "洗濯 便利グッズ"]
  # --- 洗剤・キッチン消耗品・日用品・水・お茶・ジュース（既存） ---
  - keyword: "洗濯洗剤"
    category: "洗剤"
    group: "consumable"
    extra_keywords: ["部屋干し 洗剤"]
  - keyword: "食器用洗剤"
    category: "洗剤"
    group: "consumable"
    extra_keywords: ["台所用洗剤"]
  - keyword: "キッチンスポンジ"
    category: "キッチン消耗品"
    group: "consumable"
    extra_keywords: ["食器洗いスポンジ"]
  - keyword: "食品用ラップ"
    category: "キッチン消耗品"
    group: "consumable"
    extra_keywords: ["キッチン消耗品"]
  - keyword: "トイレットペーパー"
    category: "日用品"
    group: "consumable"
    extra_keywords: ["トイレ用洗剤"]
  - keyword: "掃除シート"
    category: "日用品"
    group: "consumable"
    extra_keywords: ["除菌シート"]
  - keyword: "ミネラルウォーター"
    category: "水"
    group: "consumable"
    extra_keywords: ["天然水"]
  - keyword: "炭酸水"
    category: "水"
    group: "consumable"
    extra_keywords: ["強炭酸水"]
  - keyword: "緑茶 ペットボトル"
    category: "お茶"
    group: "consumable"
    extra_keywords: ["お茶 ペットボトル"]
  - keyword: "麦茶 ペットボトル"
    category: "お茶"
    group: "consumable"
    extra_keywords: ["はと麦茶"]
  - keyword: "野菜ジュース"
    category: "ジュース"
    group: "consumable"
    extra_keywords: ["フルーツジュース"]
  - keyword: "100%ジュース"
    category: "ジュース"
    group: "consumable"
    extra_keywords: ["果汁100% ジュース"]
  # --- 食品（全ジャンル化で追加） ---
  - keyword: "レトルト食品"
    category: "食品"
    group: "consumable"
    extra_keywords: ["レトルトカレー"]
  - keyword: "乾麺"
    category: "食品"
    group: "consumable"
    extra_keywords: ["パスタ 乾麺"]
  # --- 美容（全ジャンル化で追加） ---
  - keyword: "フェイスマスク"
    category: "美容"
    group: "consumable"
    extra_keywords: ["シートマスク"]
  - keyword: "美顔ローラー"
    category: "美容"
    group: "convenience"
    extra_keywords: ["フェイスローラー"]
  # --- 家電（全ジャンル化で追加） ---
  - keyword: "サーキュレーター"
    category: "家電"
    group: "convenience"
    extra_keywords: ["扇風機"]
  - keyword: "加湿器"
    category: "家電"
    group: "convenience"
    extra_keywords: ["卓上加湿器"]
  # --- 生活雑貨（全ジャンル化で追加） ---
  - keyword: "アロマディフューザー"
    category: "生活雑貨"
    group: "convenience"
    extra_keywords: ["アロマグッズ"]
  # --- ファッション（全ジャンル化で追加。財布・アクセサリー等は
  #     off_theme_keywordsで従来どおり除外されるため、暮らしに実用的な
  #     アイテムを中心にしている） ---
  - keyword: "折りたたみ傘"
    category: "ファッション"
    group: "convenience"
    extra_keywords: ["レイングッズ"]
  - keyword: "エコバッグ"
    category: "ファッション"
    group: "convenience"
    extra_keywords: ["折りたたみバッグ"]
  # --- ペット用品（全ジャンル化で追加） ---
  - keyword: "犬 おもちゃ"
    category: "ペット用品"
    group: "convenience"
    extra_keywords: ["猫 おもちゃ"]
  - keyword: "ペットフード"
    category: "ペット用品"
    group: "consumable"
    extra_keywords: ["キャットフード"]
  # --- ベビー用品（全ジャンル化で追加） ---
  - keyword: "ベビー用品"
    category: "ベビー用品"
    group: "convenience"
    extra_keywords: ["育児グッズ"]
  - keyword: "おむつ"
    category: "ベビー用品"
    group: "consumable"
    extra_keywords: ["ベビー用おむつ"]
  # --- 健康関連（全ジャンル化で追加。医薬品・医療機器・サプリメント等は
  #     対象にせず、体温計・血圧計等の非接触・非侵襲の測定機器のみにしている） ---
  - keyword: "体温計"
    category: "健康"
    group: "convenience"
    extra_keywords: ["非接触体温計"]
  - keyword: "血圧計"
    category: "健康"
    group: "convenience"
    extra_keywords: ["家庭用血圧計"]

# 商品選定条件（必須）
selection_criteria:
  min_review_average: 4.0   # レビュー評価（この値以上）
  min_review_count: 100     # レビュー件数（この値以上）

# 商品名・商品説明にこれらの言葉が含まれる場合は候補から除外する
# （福袋・ランダム・訳あり詰め合わせなど、ROOMで紹介しにくい商品を弾くための簡易チェック）。
#
# 医薬品・医療機器・サプリメント等は、誤った効果効能の断定リスクが高く
# 紹介文の安全性を担保しにくいため、全ジャンル化（description-genre-001）に
# あわせてここで除外している（「治る」「改善する」「予防できる」等の
# 効果を紹介文に書かないという既存の安全策と合わせて、そもそも候補に
# 挙げない側の対策）。
ng_keywords:
  - "福袋"
  - "ランダム"
  - "訳あり"
  - "詰め合わせ"
  - "アソート"
  - "在庫処分"
  - "選べない"
  - "医薬品"
  - "第1類医薬品"
  - "第一類医薬品"
  - "第2類医薬品"
  - "第二類医薬品"
  - "指定第2類医薬品"
  - "指定第二類医薬品"
  - "第3類医薬品"
  - "第三類医薬品"
  - "要指導医薬品"
  - "処方薬"
  - "サプリメント"
  - "医療機器"

# 商品名・商品説明にこれらの言葉が含まれる場合は、テーマ（暮らしの便利グッズ）から
# 明らかに外れる（耳かき・財布・アクセサリーなどのファッション小物・パーソナルケア用品）
# とみなし、検索キーワードに一致していても強制的に除外する。
#
# 補足：以前は「テーマ関連語を1つも含まない商品は除外する」という逆方向の判定も
# 行っていたが、そちらは「コードレス充電式ハンディクリーナー」のような、商品名に
# 『時短』などの単語を含まないだけの正当な商品まで誤って除外してしまう問題が
# テストで見つかったため取りやめ、このoff_theme_keywordsによる除外のみにしている。
off_theme_keywords:
  - "耳かき"
  - "耳掃除"
  - "パスケース"
  - "カードケース"
  - "名刺入れ"
  - "コインケース"
  - "財布"
  - "小銭入れ"
  - "ネックレス"
  - "ピアス"
  - "イヤリング"
  - "ブレスレット"
  - "指輪"
  - "リング"
  - "ハンドバッグ"
  - "トートバッグ"
  - "リュック"
  - "スニーカー"
  - "サンダル"
  - "パンプス"
  - "香水"
  - "コスメ"
  - "化粧品"
  - "メイク"
  - "ネイル"
  - "ヘアアクセ"
  - "腕時計"
  - "ウォッチ"
  - "ぬいぐるみ"
  - "フィギュア"

# 商品名・商品説明にこれらの言葉が含まれる場合、ビール・チューハイ・ワインなどの
# アルコール飲料とみなして候補から除外する（「消耗品・飲料」枠の飲料カテゴリ
# 〈水／お茶／ジュース〉にだけ適用する）。
alcohol_keywords:
  - "ビール"
  - "発泡酒"
  - "チューハイ"
  - "缶チューハイ"
  - "酎ハイ"
  - "カクテル"
  - "ワイン"
  - "日本酒"
  - "焼酎"
  - "ウイスキー"
  - "ウィスキー"
  - "ハイボール"
  - "スピリッツ"
  - "リキュール"
  - "梅酒"
  - "サワー"
  - "アルコール"

# 商品名・商品説明にこれらの言葉が含まれる場合、消耗品そのものではなく「消耗品を
# 置く／収納するための耐久雑貨」（トイレットペーパーホルダー、ティッシュケース等）
# とみなして候補から除外する（「消耗品・飲料」枠にだけ適用する）。消耗品枠は
# 「一度買えば長期間使う耐久品」より「消費して再購入される商品」を優先するため。
consumable_durable_accessory_keywords:
  - "ホルダー"
  - "スタンド"
  - "ラック"
  - "カバー"
  - "ケース"
  - "トレー"
  - "フック"
  - "ディスペンサー"
  - "収納"

# 同じカテゴリ内で商品名の類似度がこの値以上の場合、「用途がほぼ同じ類似商品」とみなし、
# レビュー評価・レビュー件数が良い方の1件だけを残す（0.0〜1.0、値が大きいほど厳しく判定）。
similarity_threshold: 0.55

# 毎日の投稿候補の件数（全ジャンルの中から売れ筋・偏り防止・ランダム性を
# 踏まえて選ぶ件数）。「暮らしの便利グッズ5件＋消耗品・飲料5件」という
# 固定構成は使わなくなった（description-genre-001。全ジャンル化）。
daily_target: 10

# 全ジャンルの候補の中で、同じジャンル（category）の商品を最大何件まで
# 連続して入れてよいか（偏りすぎを防ぎつつ、無理に均等にはしない。
# 「各ジャンル◯件」の固定ローテーションにはしない）。候補が不足する
# ジャンルしかない場合は、この上限を超えてでもdaily_targetに近づける
# （品質条件は緩めない）。
max_per_category: 2

# キーワード1件あたりの取得件数（多すぎるとAPIの負荷が上がるので控えめに）
items_per_keyword: 15

# 紹介文の最大文字数
description_max_length: 500

# 紹介文の末尾につける、全カテゴリ共通のハッシュタグ。
# （カテゴリ別のハッシュタグ・商品名から推測した追加ハッシュタグは自動で追加される）
default_hashtags:
  - "#暮らしの便利グッズ"

# GitHub Actionsの実行結果画面（Summary）に表示する候補の件数
# （スマートフォンでも見やすいように、多くても10件程度がおすすめ）
summary_item_limit: 10
