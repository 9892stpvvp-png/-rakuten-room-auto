name: 商品候補検索の自動実行

# 毎日 日本時間15:30（UTC 06:30）に、既存の「商品候補を検索する」
# ワークフロー（search_candidates.yml）を1回起動する。
#
# cronは1日1回しか予定時刻に一致しないため、同じ日に自動実行が重複することは
# ない。sleepや、時刻をランダムに決めて事前に記録しておくような仕組みは
# 使っていない、シンプルな構成にしている。
#
# 商品候補検索そのもの・重複チェック・紹介文生成・Artifact保存・Summary表示は
# search_candidates.yml 側の処理のまま変更しない。このワークフローは
# 「いつ起動するか」だけを担当する。
on:
  schedule:
    - cron: "30 6 * * *" # 毎日 UTC 06:30 = 日本時間15:30
  workflow_dispatch: {} # 手動実行時は即座に起動する

permissions:
  actions: write # search_candidates.yml をworkflow_dispatchで起動するために必要

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 商品候補検索ワークフローを起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run search_candidates.yml --ref "${{ github.ref_name }}"
