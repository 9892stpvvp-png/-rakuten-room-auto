name: 商品候補を検索する

# 「Actions」タブから手動で実行するためのトリガー。
# 自動投稿は一切行わず、候補一覧ファイルを作成するだけのワークフロー。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 商品候補を検索して候補一覧を作成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python -m src.main

      - name: 候補一覧をActionsの成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-room-candidates
          path: data/candidates/
          if-no-files-found: warn

      # ここから下は、スマホ用投稿ページ（room/）を最新の候補一覧で更新するための
      # 追加処理。商品検索・条件判定・重複チェック・紹介文生成（上のsrc.main）の
      # 処理内容そのものには一切手を加えていない。
      - name: スマホ用投稿ページのデータを書き出す
        run: python -m src.publish_room_page

      - name: 投稿ページのデータをコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add room/data/candidates.json
          if git diff --staged --quiet; then
            echo "投稿ページのデータに変化がないため、コミットしません。"
          else
            git commit -m "投稿ページのデータを更新"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
