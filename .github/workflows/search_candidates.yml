name: 商品候補を検索する

# 「Actions」タブから手動で実行するためのトリガー。
# 自動投稿は一切行わず、候補一覧ファイルを作成するだけのワークフロー。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 商品候補を検索して候補一覧を作成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python -m src.main

      - name: 候補一覧をActionsの成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-room-candidates
          path: data/candidates/
          if-no-files-found: warn

      # ここから下は、スマホ用投稿ページ（room/）を最新の候補一覧で更新するための
      # 追加処理。商品検索・条件判定・重複チェック・紹介文生成（上のsrc.main）の
      # 処理内容そのものには一切手を加えていない。
      - name: スマホ用投稿ページのデータを書き出す
        run: python -m src.publish_room_page

      # ここから下は、ROOM候補生成が成功したあと、その10件を使ってTikTok
      # 投稿向けコンテンツ（1商品選定＋台本・テロップ・ナレーション・
      # キャプション・ハッシュタグ・動画制作メモ）を生成するための追加処理。
      # 前のステップ（商品検索・publish_room_page）が失敗した場合は、GitHub
      # Actionsのデフォルト挙動により後続ステップは実行されないため、
      # TikTok側だけ単独で不完全なデータを作ることはない。動画ファイルの
      # 生成・外部の動画生成API連携・TikTokへの自動投稿は行わない。
      - name: TikTok投稿用コンテンツを生成する
        run: python -m src.tiktok_daily

      - name: 投稿ページ・TikTok用データをコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add room/data/candidates.json tiktok/daily_content.json tiktok/daily_content.md data/tiktok_history.json
          if git diff --staged --quiet; then
            echo "投稿ページ・TikTok用データに変化がないため、コミットしません。"
          else
            git commit -m "投稿ページ・TikTok用データを更新"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
