name: Claude Auto Start

on:
  push:
    branches:
      - main
    paths:
      - docs/AI_TASK.md
  repository_dispatch:
    types:
      - claude-ai-task-ready
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: claude-auto-start-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dispatch-claude:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch supported Claude event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/dispatches" \
            -f event_type='claude-ai-task-ready'

  run-claude-task:
    if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check Claude OAuth token
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN is not configured. Claude auto-start is skipped."

      - name: Run Claude Code for latest AI task
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          allowed_bots: |
            github-actions
          prompt: |
            Read CLAUDE.md and docs/AI_TASK.md, then execute the latest READY task completely.
            Inspect the repository before changing anything.
            Follow all safety rules in CLAUDE.md and docs/AI_TASK.md.
            Do not expose or commit secrets, tokens, passwords, MFA information, .env files, or real credentials.
            Do not implement automatic TikTok posting, automatic Rakuten ROOM posting, automatic login, purchasing, or paid-service activation.
            Preserve existing Rakuten ROOM functionality unless the task explicitly requires a safe compatible change.
            Work on a dedicated branch, run appropriate tests, update docs/AI_STATUS.md with the result, push the branch, and create a pull request to main.
            Do not modify docs/AI_TASK.md yourself.
          claude_args: |
            --max-turns 40
