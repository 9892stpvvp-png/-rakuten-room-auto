<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>楽天ROOM 投稿ページ</title>
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #f5f3ef;
    color: #222;
    margin: 0;
    padding: 12px 12px 48px;
    line-height: 1.6;
  }
  h1 {
    font-size: 1.25em;
    margin: 4px 0 2px;
    color: #bf0000;
  }
  .updated {
    font-size: 0.82em;
    color: #666;
    margin-bottom: 12px;
  }
  .progress {
    background: #fff;
    border: 1px solid #e3ddd2;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 0.92em;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }
  .progress b {
    font-size: 1.05em;
  }
  .group-breakdown {
    width: 100%;
    font-size: 0.85em;
    color: #666;
    border-top: 1px dashed #e3ddd2;
    margin-top: 8px;
    padding-top: 8px;
  }
  .group-badge {
    display: inline-block;
    font-size: 0.78em;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    background: #eef2f7;
    color: #35577a;
  }
  .group-badge.is-consumable {
    background: #fdf1e3;
    color: #9a5b17;
  }
  .group-badge.is-beverage {
    background: #e6f5ee;
    color: #1c7a52;
  }
  .filter-row {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  #filterToggle,
  #copyPostedBtn,
  #registerGithubLink {
    background: #fff;
    border: 1px solid #bbb;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.88em;
    color: #444;
  }
  #registerGithubLink {
    display: inline-block;
    text-decoration: none;
    box-sizing: border-box;
  }
  #filterToggle.active {
    background: #bf0000;
    border-color: #bf0000;
    color: #fff;
  }
  #copyPostedBtn.copied {
    background: #2e7d32;
    border-color: #2e7d32;
    color: #fff;
  }
  .register-help {
    font-size: 0.78em;
    color: #777;
    margin: -6px 0 14px;
    line-height: 1.5;
  }
  #status {
    text-align: center;
    color: #777;
    padding: 40px 10px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    padding: 16px;
    transition: opacity 0.2s;
  }
  .card.posted {
    opacity: 0.45;
  }
  .card.hidden-by-filter {
    display: none;
  }
  .card-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    background: #fafafa;
    border-radius: 10px;
    margin-bottom: 12px;
    display: block;
  }
  .card-name {
    font-size: 1.05em;
    font-weight: 600;
    margin: 0 0 8px;
    word-break: break-word;
  }
  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: 0.92em;
    color: #444;
    margin-bottom: 12px;
  }
  .card-price {
    font-weight: 700;
    color: #bf0000;
    font-size: 1.05em;
  }
  .card-review {
    color: #555;
  }
  .posted-badge {
    display: inline-block;
    background: #2e7d32;
    color: #fff;
    font-size: 0.8em;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .card-description {
    background: #fbf8f2;
    border: 1px solid #ece4d6;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.94em;
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 14px;
    max-height: 260px;
    overflow-y: auto;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 12px;
    padding: 15px 10px;
    font-size: 1em;
    font-weight: 700;
    margin-bottom: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary {
    background: #bf0000;
    color: #fff;
  }
  .btn-secondary {
    background: #1e6fd9;
    color: #fff;
  }
  .btn-outline {
    background: #fff;
    color: #333;
    border: 1px solid #ccc;
    font-weight: 600;
    font-size: 0.95em;
    padding: 12px 10px;
  }
  .btn-copy-small {
    background: #fff;
    color: #333;
    border: 1px solid #ccc;
    font-weight: 600;
    font-size: 0.9em;
    padding: 12px 10px;
  }
  .btn-caption {
    text-align: center;
    font-size: 0.78em;
    color: #666;
    margin: -6px 0 14px;
  }
  .btn.copied {
    background: #2e7d32;
    color: #fff;
    border-color: #2e7d32;
  }
  .btn-posted-toggle {
    background: #fff;
    color: #444;
    border: 2px solid #999;
    font-weight: 700;
    padding: 13px 10px;
    margin-top: 4px;
  }
  .btn-posted-toggle.is-posted {
    background: #2e7d32;
    border-color: #2e7d32;
    color: #fff;
  }
</style>
</head>
<body>

<h1>楽天ROOM 投稿ページ</h1>
<div class="updated" id="updatedAt">最終更新：読み込み中…</div>

<div class="progress" id="progress">
  <span>今日の投稿候補：<b id="totalCount">-</b>件</span>
  <span>投稿済み：<b id="postedCount">-</b>件</span>
  <span>残り：<b id="remainingCount">-</b>件</span>
  <div class="group-breakdown" id="groupBreakdown"></div>
</div>

<div class="filter-row">
  <button id="copyPostedBtn" type="button">① 投稿済みデータをコピー</button>
  <a id="registerGithubLink" href="https://github.com/9892stpvvp-png/-rakuten-room-auto/actions/workflows/import_posted_items.yml" target="_blank" rel="noopener">② GitHubへ登録する</a>
  <button id="filterToggle" type="button">未投稿のみ表示</button>
</div>
<p class="register-help">
  ROOMへ投稿し終えたら、上のカードで「投稿済みにする」→「① 投稿済みデータをコピー」→
  「② GitHubへ登録する」を開いて「Run workflow」→貼り付けて実行、の順で進めると、
  パソコンやChatGPTを使わずに投稿済み履歴（重複防止用データ）を更新できます。
  実行できるのはこのリポジトリの書き込み権限を持つ人だけです。
</p>

<div id="status">読み込み中…</div>
<div id="cards"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "rakutenRoomPostedItems";

  var state = {
    items: [],
    posted: loadPosted(),
    showUnpostedOnly: false,
  };

  function loadPosted() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function savePosted() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.posted));
    } catch (e) {
      // localStorageが使えない環境（プライベートブラウズ等）では、
      // ページを閉じるまでの間だけ状態が保持される。
    }
  }

  function isPosted(itemCode) {
    return !!state.posted[itemCode];
  }

  function escapeHtml(text) {
    return String(text == null ? "" : text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatPrice(price) {
    var n = Number(price) || 0;
    return n.toLocaleString("ja-JP") + "円";
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    // クリップボードAPIが使えない古い環境向けのフォールバック。
    return new Promise(function (resolve, reject) {
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        var ok = document.execCommand("copy");
        document.body.removeChild(textarea);
        ok ? resolve() : reject(new Error("execCommand failed"));
      } catch (err) {
        document.body.removeChild(textarea);
        reject(err);
      }
    });
  }

  function flashCopied(button, originalLabel) {
    button.textContent = "コピーしました ✓";
    button.classList.add("copied");
    window.setTimeout(function () {
      button.textContent = originalLabel;
      button.classList.remove("copied");
    }, 1600);
  }

  function updateProgress() {
    var total = state.items.length;
    var posted = state.items.filter(function (item) {
      return isPosted(item.item_code);
    }).length;
    document.getElementById("totalCount").textContent = total;
    document.getElementById("postedCount").textContent = posted;
    document.getElementById("remainingCount").textContent = total - posted;

    var convenienceCount = state.items.filter(function (item) {
      return item.group_label === "便利グッズ";
    }).length;
    var consumableCount = total - convenienceCount;
    var breakdownEl = document.getElementById("groupBreakdown");
    if (breakdownEl) {
      breakdownEl.textContent =
        total === 0
          ? ""
          : "内訳：便利グッズ " + convenienceCount + "件 / 消耗品・飲料 " + consumableCount + "件";
    }
  }

  function buildPostedExportRecords() {
    // 「投稿済みにする」で登録済みの商品を、data/posted_items.json へ取り込める
    // 形式（item_code / item_url / product_name / posted_at / category）の配列にする。
    return Object.keys(state.posted).map(function (itemCode) {
      var raw = state.posted[itemCode];
      if (raw && typeof raw === "object") {
        return {
          item_code: raw.item_code || itemCode,
          item_url: raw.item_url || "",
          product_name: raw.product_name || "",
          posted_at: raw.posted_at || "",
          category: raw.category || "",
        };
      }
      // 以前のバージョン（真偽値のみ保存）で登録された商品への互換対応。
      // 今表示中の候補に同じ商品があれば、そこから商品URL・商品名を補う。
      var matched = state.items.filter(function (item) {
        return item.item_code === itemCode;
      })[0];
      return {
        item_code: itemCode,
        item_url: (matched && matched.item_url) || "",
        product_name: (matched && matched.name) || "",
        posted_at: "",
        category: (matched && matched.category) || "",
      };
    });
  }

  function applyFilter() {
    var cards = document.querySelectorAll(".card");
    cards.forEach(function (card) {
      var posted = card.classList.contains("posted");
      if (state.showUnpostedOnly && posted) {
        card.classList.add("hidden-by-filter");
      } else {
        card.classList.remove("hidden-by-filter");
      }
    });
  }

  function togglePosted(itemCode, card, toggleButton, item) {
    var nowPosted = !isPosted(itemCode);
    if (nowPosted) {
      // 投稿済み履歴（data/posted_items.json）へそのまま取り込める形で、
      // 商品情報とタイムスタンプを一緒に記録しておく。
      state.posted[itemCode] = {
        item_code: itemCode,
        item_url: (item && item.item_url) || "",
        product_name: (item && item.name) || "",
        posted_at: new Date().toISOString(),
        category: (item && item.category) || "",
      };
    } else {
      delete state.posted[itemCode];
    }
    savePosted();

    card.classList.toggle("posted", nowPosted);
    toggleButton.classList.toggle("is-posted", nowPosted);
    toggleButton.textContent = nowPosted ? "投稿済み ✓（タップで戻す）" : "投稿済みにする";

    var badge = card.querySelector(".posted-badge");
    if (nowPosted && !badge) {
      badge = document.createElement("div");
      badge.className = "posted-badge";
      badge.textContent = "投稿済み ✓";
      card.insertBefore(badge, card.firstChild);
    } else if (!nowPosted && badge) {
      badge.remove();
    }

    updateProgress();
    applyFilter();
  }

  function renderCard(item) {
    var card = document.createElement("div");
    card.className = "card" + (isPosted(item.item_code) ? " posted" : "");

    if (isPosted(item.item_code)) {
      var badge = document.createElement("div");
      badge.className = "posted-badge";
      badge.textContent = "投稿済み ✓";
      card.appendChild(badge);
    }

    if (item.group_label) {
      var groupBadge = document.createElement("span");
      var groupBadgeClass = "group-badge";
      if (item.group_label === "消耗品") {
        groupBadgeClass += " is-consumable";
      } else if (item.group_label === "飲料") {
        groupBadgeClass += " is-beverage";
      }
      groupBadge.className = groupBadgeClass;
      groupBadge.textContent = item.group_label;
      card.appendChild(groupBadge);
    }

    var img = document.createElement("img");
    img.className = "card-image";
    img.loading = "lazy";
    img.src = item.image_url || "";
    img.alt = item.name || "商品画像";
    card.appendChild(img);

    var name = document.createElement("p");
    name.className = "card-name";
    name.textContent = item.name || "(商品名不明)";
    card.appendChild(name);

    var meta = document.createElement("div");
    meta.className = "card-meta";
    meta.innerHTML =
      '<span class="card-price">' + escapeHtml(formatPrice(item.price)) + "</span>" +
      '<span class="card-review">⭐ ' + escapeHtml((Number(item.review_average) || 0).toFixed(1)) +
      "（" + escapeHtml(item.review_count || 0) + "件）</span>";
    card.appendChild(meta);

    var desc = document.createElement("div");
    desc.className = "card-description";
    desc.textContent = item.description || "";
    card.appendChild(desc);

    // 紹介文をコピー
    var copyDescBtn = document.createElement("button");
    copyDescBtn.type = "button";
    copyDescBtn.className = "btn btn-primary";
    copyDescBtn.textContent = "① 紹介文をコピー";
    copyDescBtn.addEventListener("click", function () {
      copyToClipboard(item.description || "").then(function () {
        flashCopied(copyDescBtn, "① 紹介文をコピー");
      }).catch(function () {
        window.alert("コピーできませんでした。紹介文を長押しして手動でコピーしてください。");
      });
    });
    card.appendChild(copyDescBtn);

    // 楽天市場を開く（APIの正式な商品URLをそのまま開く。楽天市場の
    // 商品ページに用意されている「ROOMで投稿」を押してもらう想定）。
    var roomLink = document.createElement("a");
    roomLink.className = "btn btn-secondary";
    roomLink.href = item.item_url || "#";
    roomLink.target = "_blank";
    roomLink.rel = "noopener";
    roomLink.textContent = "② 楽天市場を開く";
    card.appendChild(roomLink);

    var roomLinkCaption = document.createElement("p");
    roomLinkCaption.className = "btn-caption";
    roomLinkCaption.textContent = "楽天市場の商品ページで「ROOMで投稿」を押す";
    card.appendChild(roomLinkCaption);

    // ROOM検索ワードをコピー（予備手段：商品ページに「ROOMで投稿」が
    // 表示されない場合に、ROOM内の検索で投稿するための商品名コピー）。
    var copyKeywordBtn = document.createElement("button");
    copyKeywordBtn.type = "button";
    copyKeywordBtn.className = "btn btn-copy-small";
    copyKeywordBtn.textContent = "ROOM検索ワードをコピー";
    copyKeywordBtn.addEventListener("click", function () {
      copyToClipboard(item.name || "").then(function () {
        flashCopied(copyKeywordBtn, "ROOM検索ワードをコピー");
      }).catch(function () {
        window.alert("コピーできませんでした。商品名を長押しして手動でコピーしてください。");
      });
    });
    card.appendChild(copyKeywordBtn);

    // ④ 商品URLをコピー
    var copyUrlBtn = document.createElement("button");
    copyUrlBtn.type = "button";
    copyUrlBtn.className = "btn btn-copy-small";
    copyUrlBtn.textContent = "商品URLをコピー";
    copyUrlBtn.addEventListener("click", function () {
      copyToClipboard(item.item_url || "").then(function () {
        flashCopied(copyUrlBtn, "商品URLをコピー");
      }).catch(function () {
        window.alert("コピーできませんでした。商品URLを長押しして手動でコピーしてください。");
      });
    });
    card.appendChild(copyUrlBtn);

    // 投稿済みにする（チェック的トグル）
    var postedBtn = document.createElement("button");
    postedBtn.type = "button";
    postedBtn.className = "btn btn-posted-toggle" + (isPosted(item.item_code) ? " is-posted" : "");
    postedBtn.textContent = isPosted(item.item_code) ? "投稿済み ✓（タップで戻す）" : "投稿済みにする";
    postedBtn.addEventListener("click", function () {
      togglePosted(item.item_code, card, postedBtn, item);
    });
    card.appendChild(postedBtn);

    return card;
  }

  function render() {
    var container = document.getElementById("cards");
    container.innerHTML = "";
    state.items.forEach(function (item) {
      container.appendChild(renderCard(item));
    });
    updateProgress();
    applyFilter();
  }

  function init() {
    document.getElementById("filterToggle").addEventListener("click", function () {
      state.showUnpostedOnly = !state.showUnpostedOnly;
      this.classList.toggle("active", state.showUnpostedOnly);
      this.textContent = state.showUnpostedOnly ? "すべて表示" : "未投稿のみ表示";
      applyFilter();
    });

    var copyPostedBtn = document.getElementById("copyPostedBtn");
    copyPostedBtn.addEventListener("click", function () {
      var records = buildPostedExportRecords();
      if (records.length === 0) {
        window.alert("まだ「投稿済みにする」で登録した商品がありません。");
        return;
      }
      // 1行のJSON（改行なし）でコピーする。GitHub Actionsの「投稿済み商品を
      // 登録する」ワークフローの入力欄（1行のテキスト欄）にそのまま貼り付け
      // られるようにするため（改行入りだと、貼り付け時に改行が失われて
      // JSONが壊れる環境があるための対策）。
      copyToClipboard(JSON.stringify(records)).then(function () {
        flashCopied(copyPostedBtn, "投稿済みデータをコピー");
      }).catch(function () {
        window.alert("コピーできませんでした。");
      });
    });

    var statusEl = document.getElementById("status");

    fetch("data/candidates.json?_=" + Date.now(), { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        return res.json();
      })
      .then(function (data) {
        state.items = (data && data.items) || [];
        document.getElementById("updatedAt").textContent =
          "最終更新：" + ((data && data.generated_at_jst) || "不明") + " JST";

        if (state.items.length === 0) {
          statusEl.textContent = "本日の候補データがまだありません。しばらくしてから再度開いてください。";
          updateProgress();
          return;
        }

        statusEl.style.display = "none";
        render();
      })
      .catch(function (err) {
        statusEl.textContent =
          "候補データの読み込みに失敗しました（" + err.message + "）。時間をおいて再読み込みしてください。";
      });
  }

  init();
})();
</script>

</body>
</html>
